<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I LOVE YOU MARIE ❤️</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Arial', sans-serif;
}


body{

    height:100vh;
    overflow:hidden;

    background:
    linear-gradient(135deg,#ff758c,#ff7eb3);

    display:flex;
    justify-content:center;
    align-items:center;

}



/* Zone principale */

.container{

    text-align:center;
    color:white;
    z-index:10;

}



h1{

    font-size:50px;
    margin-bottom:20px;

    animation:title 2s infinite alternate;

    text-shadow:
    0 0 10px white,
    0 0 20px red;

}



@keyframes title{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.1);
    }

}



/* Photo */

.photo img{


    width:200px;
    height:200px;

    object-fit:cover;

    border-radius:50%;

    border:6px solid white;

    box-shadow:
    0 0 20px white,
    0 0 40px red;


    animation:photo 3s infinite alternate;


}



@keyframes photo{

    from{

        transform:translateY(0);

    }


    to{

        transform:translateY(-20px);

    }

}





h2{

    margin-top:25px;

    font-size:42px;

    animation:love 2s infinite alternate;


}



@keyframes love{


    from{

        text-shadow:0 0 5px white;

    }


    to{

        text-shadow:
        0 0 20px red,
        0 0 40px pink;

    }

}




p{

    font-size:22px;

    margin:20px;

}



button{


    padding:15px 35px;

    border:none;

    border-radius:40px;

    background:white;

    color:#ff4d88;

    font-size:20px;

    cursor:pointer;

    transition:0.5s;


}



button:hover{


    transform:scale(1.2) rotate(5deg);

    background:#ffe6ef;


}




footer{

    margin-top:40px;

    font-size:18px;

}





/* Coeurs */

.heart{

    position:absolute;

    font-size:30px;

    animation:heartMove 6s linear infinite;

}



@keyframes heartMove{


    0%{

        transform:
        translateY(100vh)
        rotate(0deg);

        opacity:1;

    }



    100%{

        transform:
        translateY(-10vh)
        rotate(360deg);

        opacity:0;

    }

}




/* Messages */

.message{


    position:absolute;

    font-size:35px;

    font-weight:bold;

    color:white;

    animation:message 4s forwards;

    text-shadow:0 0 20px red;


}



@keyframes message{


    0%{

        transform:scale(0);

        opacity:0;

    }


    50%{

        transform:scale(1.5);

        opacity:1;

    }


    100%{

        opacity:0;

    }


}







/* Fleurs */

.flower{


    position:absolute;

    font-size:45px;

    animation:flower 5s infinite alternate;


}



@keyframes flower{


    from{

        transform:
        translateY(0)
        rotate(0deg);

    }


    to{

        transform:
        translateY(-50px)
        rotate(30deg);

    }


}







/* Etoiles */

.star{


    position:absolute;

    font-size:25px;

    color:white;

    animation:star 4s linear infinite;


}



@keyframes star{


    0%{

        transform:
        translateY(100vh)
        rotate(0deg);

        opacity:1;

    }


    100%{

        transform:
        translateY(-100vh)
        rotate(360deg);

        opacity:0;

    }


}


</style>


</head>



<body>



<div class="container">


    <h1>
        ❤️ Marie ❤️
    </h1>



    <div class="photo">

        <img src="marie.jpg" alt="Marie">

    </div>



    <h2>
        I LOVE YOU MARIE!!! ❤️
    </h2>



    <p>
        Une petite création spéciale faite avec beaucoup d'amour 🌹
    </p>



    <button onclick="surprise()">

        Clique ici 💌

    </button>



    <footer>

        Créé avec ❤️ par Andy

    </footer>


</div>






<script>


// Création des coeurs

function createHeart(){


    let heart=document.createElement("div");


    heart.className="heart";


    heart.innerHTML="❤️";


    heart.style.left=Math.random()*100+"vw";


    heart.style.animationDuration=
    (3+Math.random()*5)+"s";



    document.body.appendChild(heart);



    setTimeout(()=>{

        heart.remove();

    },6000);


}



setInterval(createHeart,300);






// Message I LOVE YOU MARIE

function createMessage(){


    let msg=document.createElement("div");


    msg.className="message";


    msg.innerHTML="I LOVE YOU MARIE!!! ❤️";


    msg.style.left=Math.random()*60+"vw";


    msg.style.top=Math.random()*70+"vh";



    document.body.appendChild(msg);



    setTimeout(()=>{

        msg.remove();

    },4000);


}



setInterval(createMessage,2500);








// Fleurs animées

let flowers=[

"🌹",
"🌸",
"🌺",
"🌷",
"🌻"

];



function createFlower(){


    let flower=document.createElement("div");


    flower.className="flower";


    flower.innerHTML=
    flowers[Math.floor(Math.random()*flowers.length)];



    flower.style.left=Math.random()*100+"vw";


    flower.style.top=Math.random()*90+"vh";



    document.body.appendChild(flower);



    setTimeout(()=>{

        flower.remove();

    },6000);


}



setInterval(createFlower,1200);








// Etoiles

function createStar(){


    let star=document.createElement("div");


    star.className="star";


    star.innerHTML="✨";


    star.style.left=Math.random()*100+"vw";


    star.style.animationDuration=
    (2+Math.random()*5)+"s";



    document.body.appendChild(star);



    setTimeout(()=>{

        star.remove();

    },5000);


}



setInterval(createStar,200);









// Surprise

function surprise(){


    alert(
    "❤️ MARIE ❤️\n\nI LOVE YOU MARIE!!!\n\nCette page a été créée spécialement pour toi par Andy 🌹"
    );


}



</script>



</body>

</html>
